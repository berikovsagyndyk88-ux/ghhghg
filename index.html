<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>погода</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .weather-icon {
            width: 72px;
            height: 72px;
            margin: 10px auto 16px;
            color: #38bdf8;
        }

        .temp {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #c41c1c 0%, #cbd5e1 100%);
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .info-item i {
            width: 18px;
            height: 18px;
            color: #38bdf8;
        }

        .status-text {
            color: #191c20;
            font-size: 0.85rem;
        }

        /* Стильная кнопка */
        button {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #e7dcdc;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }
        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Текущая погода</h3>
        <div class="temp" id="temp">-- °C</div>
        <p id="wind">Ветер: -- км/ч</p>
        <p id="status">Загрузка...</p>
        <button onclick="getWeather()">Обновить</button>
    </div>
    <script>
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=52.94&longitude=70.20&current_weather=true';
        async function getWeather() {
            document.getElementById('status').innerText = 'Загрузка';
            try {
                const response = await fetch(url);
                const data = await response.json();

                const weather = data.current_weather;
                document.getElementById('temp').innerText = weather.temperature + ' °C';
                document.getElementById('wind').innerText = 'Ветер: ' + weather.windspeed + ' км/ч';
                document.getElementById('status').innerText = 'Обновлено';
            } catch (error) {
                document.getElementById('status').innerText = 'Ошибка загрузки';
            }
        }
    </script>
</body>
</html>
